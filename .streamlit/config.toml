[client]
showSidebarNavigation = true
toolbarMode = "minimal"
# Public site: never render Python tracebacks (file paths, source lines) into the
# browser on an unhandled exception. Streamlit's default here is "full".
showErrorDetails = "none"

[server]
# No hot-reload in a container; the watchdog observer on /app is pure overhead.
fileWatcherType = "none"
# NOTE: enableWebsocketCompression was set here and removed again. It was never tested
# through the Caddy reverse proxy, where permessage-deflate negotiated with context
# takeover on both sides. Do not re-enable it without verifying a long session through
# the real proxy first. The ~75 KB of CSS that prompted it is now served from /media/
# instead of being pasted into the page, so there is much less left to compress.

[theme]
base                     = "dark"
primaryColor             = "#2596be"
backgroundColor          = "#0b1318"
secondaryBackgroundColor = "#111d23"
textColor                = "#e2f1f8"
font                     = "sans serif"
